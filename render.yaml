services:
  - type: web
    name: weather-app-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: API_V1_PREFIX
        value: /api/v1
      - key: PROJECT_NAME
        value: Weather App API
      - key: WEATHER_CACHE_MINUTES
        value: 10